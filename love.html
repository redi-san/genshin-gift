<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Why I Love You 💖</title>
  <link rel="stylesheet" href="love.css" />
</head>
<body class="love-body">

  <div class="love-container" id="container">
    <p id="love-text">Tap to begin</p>
  </div>

  <script>
    // 🎵 MUSIC (simple + reliable)
    const bgMusic = new Audio("Dream of Scattered Petals.mp3");
    bgMusic.loop = true;
    bgMusic.volume = 0.4;

    function startMusic() {
      bgMusic.play().catch(() => {
        document.addEventListener("click", () => bgMusic.play(), { once: true });
      });
    }

    startMusic();

    // 💖 TEXT CONTENT
    const lines = [
      "Hi Rinny",
      "Do you want to know why people love you?",
      "I do not even know where to start...",
      "Because there are too many reasons we love you.",
      "We love you because youre a kind friend",
      "We love you because you care",
      "We love you because youre so fun",
      "We love you because youre so friendly",
      "We love you because youre the rinny we know",
      "Now...",
      "Do you want to know why...",
      "I... aka",
      "loves you so much",
      "I love the way you cross paths in my life",
      "I love how you make even simple moments feel special",
      "I love your kindness, even when the world is mean",
      "I love how you never give up, even when things are hard",
      "I love how youre so pretty",
      "I love how youre so cute",
      "I love how youre so gorgeous",
      "I love your pretty hair",
      "I love your dreamy eyes",
      "I love your nose, I wanna boop it",
      "I love your smile, heh I know you smile",
      "I love your cute cute super duper pretty face",
      "I love that youre so beautiful",
      "But its not your looks that make you beautiful",
      "I love your presence... it feels like happiness",
      "I love your sweetness kindess and care",
      "I love the way you are just simply rinny",
      "Not perfect. Not Fake. Just a sweet rinny",
      "You keep on going no matter what",
      "And thats what makes you beautiful to me",
      "If I had to choose a soul to be with forever...",
      "I would always choose you every single time",
      "Because loving you is the most natural thing I have ever done",
      "And I will keep loving you always, no matter what",
      "Theres more I want to say but hehe",
      "You are loved. More than you know it rinny",
      "From aka",
      "We love you"
    ];

    let index = 0;
    const textEl = document.getElementById("love-text");
    const container = document.getElementById("container");

    function nextLine() {
      if (index < lines.length) {
        textEl.textContent = lines[index];
        index++;
      } else {
        textEl.textContent = "I love you Rinny 💖";

        setTimeout(() => {
          window.location.href = "menu.html";
        }, 2500);
      }
    }

    // ⭐ IMPORTANT: force click works everywhere
    container.addEventListener("click", nextLine);
  </script>

</body>
</html>
